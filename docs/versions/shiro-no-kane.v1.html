<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color" content="#faf7f0" />
    <title>城の鐘</title>
    <style>
      /* Seven palette tokens, one set per theme. The dark set is written out
         twice rather than folded into light-dark(): that function drops the whole
         declaration below Safari 17.5, and an unstyled reader is a worse failure
         than eight repeated lines. The media block is guarded rather than paired
         with a light block, so the system preference stays the default and an
         explicit 設定 choice — stamped as data-theme on <html>, where it can also
         reach color-scheme — wins in both directions. */
      :root {
        color-scheme: light;
        --paper: #faf7f0;
        --ink: #22201c;
        --muted: #6f695e;
        --rule: #e2dcd0;
        --accent: #7a5c2e;
        --weak: #b4562a;
        --new: #2f7d6a;
        --veil: rgba(34, 32, 28, 0.38);

        --serif: "Hiragino Mincho ProN", "Yu Mincho", serif;
        --sans: -apple-system, system-ui, sans-serif;

        /* Written by Prefs.apply() and PageBox.refresh() on documentElement.
           These are what the reader paints with before either has run, and what
           it keeps if localStorage throws. --fs is a LENGTH, applied verbatim:
           the setting has to be what the type measures. */
        --fs: 28px;
        --lh: 2.6;
        --measure: 30;
        --extent: 6;

        --gutter: 16px;
        --tap: clamp(40px, 2.75rem, 56px);
        --chrome-gap: 0.34rem;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        /* The permanent chrome reserve. The bars are fixed overlays, but the page
           box subtracts these unconditionally, so the box is the same size whether
           chrome is shown or hidden and a bar fade can never repaginate. THESE TWO
           MUST NOT CHANGE while a story is open. */
        --top-h: calc(var(--tap) + var(--chrome-gap) * 2 + var(--safe-t));
        --bar-h: calc(var(--tap) + var(--chrome-gap) * 2 + var(--safe-b));
        --scrim: 1.25rem;

        --z-chrome: 20;
        --z-sheet: 30;
        --z-veil: 40;
        --z-panel: 50;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --paper: #16151a;
          --ink: #e8e4dc;
          --muted: #9a9488;
          --rule: #2c2a31;
          --accent: #d3b075;
          --weak: #e0895e;
          --new: #6cc5ab;
          --veil: rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #16151a;
        --ink: #e8e4dc;
        --muted: #9a9488;
        --rule: #2c2a31;
        --accent: #d3b075;
        --weak: #e0895e;
        --new: #6cc5ab;
        --veil: rgba(0, 0, 0, 0.5);
      }

      *, *::before, *::after { box-sizing: border-box; }
      /* #sheet, #settings, #veil and #sheet-head all lay out with display, which
         beats the UA's [hidden] rule and would ship them open. */
      [hidden] { display: none !important; }

      /* Nothing scrolls, anywhere. That is not only a layout decision: with the
         document unscrollable iOS never collapses its toolbar, so dvh stops moving
         mid-session and the reflow it would cause — which would repaginate under
         the reader's finger — cannot happen. text-size-adjust is what holds the
         rendered size equal to the setting on iOS, which inflates text in narrow
         blocks otherwise. */
      html {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--paper);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        height: 100vh;
        height: 100dvh; /* order load-bearing: vh is the pre-15.4 fallback */
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 0.85rem;
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ---- the track ---------------------------------------------------- */
      /* Exactly the viewport, so a cell width is exactly the distance a gesture
         drags. Three cells at flex-basis 100% overflow it by two viewports; html
         and body clip the rest.

         #track carries a transform, which makes it the containing block for any
         position:fixed descendant — so #top, #bar, #sheet, #veil and #settings
         MUST stay its siblings. will-change: transform, a non-none filter,
         backdrop-filter and contain: paint each do the same thing on their own;
         none of them may ever appear on #track or on <body>.

         No transition here on purpose: the gesture code sets and clears one
         inline, which is what lets the settle reset the transform in the same
         frame as the cell rotation without animating backwards over the turn. */
      #track {
        position: fixed;
        inset: 0;
        display: flex;
        transform: translateX(-100%);
        /* All panning is ours; the browser keeps pinch-zoom. */
        touch-action: pinch-zoom;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #track * { touch-action: pinch-zoom; }
      /* A mouse drag is a text selection, so the fine-pointer platform keeps
         copy-out and turns pages with the keys and 前/次 instead. */
      @media (hover: hover) and (pointer: fine) {
        #track, #track * { -webkit-user-select: text; user-select: text; }
        /* Re-excluded at (1,0,1), because the rule above is what defeats the
           plain `rt` one: a sentence dragged out of the page must copy as 私,
           never as 私わたし. The clipboard half of that promise is kept in JS —
           only Chrome honours this in the copy string. */
        #track rt { -webkit-user-select: none; user-select: none; }
      }

      /* The chrome clearance is the CELL's padding, not the track's, because the
         track has to stay exactly one viewport wide. The cell itself never
         rotates — only the box inside it does — so its logical padding maps to
         physical top/bottom and left/right in both writing modes, which is what
         holds text clear of the physically top and bottom bars. */
      .cell {
        flex: 0 0 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-block: var(--top-h) var(--bar-h);
        padding-inline: max(var(--gutter), var(--safe-l)) max(var(--gutter), var(--safe-r));
      }

      /* The hidden probe the paginator measures against. Fixed at inset 0 like
         #track, with its cell absolutely filling it, so one set of rules sizes
         both it and a live cell and nothing has to be pinned from JS.
         visibility: hidden still lays out, which is the entire point; it also
         keeps the text out of find-in-page and out of the accessibility tree.
         Created by PageBox.init() rather than by reader.html, because build.py's
         render_split matches reader.html by whole indented block. */
      #measure {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        contain: layout;
        z-index: -1;
      }
      #measure .cell { position: absolute; inset: 0; }
      /* The probe opts out of the clipping its live twin needs. Clipping is there
         to stop a stray focus()/find-in-page scroll on a cell the reader can
         reach, and none of those reach a hidden, inert, pointer-events: none
         probe — while every split in the book is decided by reading scrollWidth /
         scrollHeight off this box. The clip-box reports a true scrolling area in
         Chrome; that is one engine, and this ships to WebKit, where the same
         mistake would read as "no page ever overflows" and nothing would ever
         split. overflow: visible is the reading both engines have shared since
         before clip existed. PageBox.selfTest() proves it on the device. */
      #measure .page, #measure .after { overflow: visible; }

      /* ---- the page box -------------------------------------------------- */
      /* One constant, centred, typographically capped rectangle, the same on a
         phone and on a laptop. --measure is full-width characters per column (per
         line in 横書き) and --extent is columns (lines); 1em is one full-width
         character, which is why the old 34rem cap had to go — it held 66 Latin
         characters but only 16 Japanese ones. Column pitch in vertical-rl is
         exactly font-size x line-height and ruby does not widen it, so
         extent * lh * 1em is an exact whole number of columns.

         min(..., 100%) is the belt that `justify-content: safe center` used to
         be, and it is strictly better: the box can never exceed its cell, so
         centring can never clip the start of it, and content that does not fit
         surfaces as measurable overflow rather than as ink outside the viewport.
         The 1px is sub-pixel insurance — block-size is computed from the specified
         numbers while the laid-out line boxes accumulate the engine's rounded
         pitch, and 1px cannot admit another line.

         overflow: clip rather than hidden because a hidden box is still a scroll
         container — a stray focus(), scrollIntoView, Find-in-page hit or the
         VoiceOver cursor can scroll it to half a column with no way back — while
         clip pins it and still reports the true scrollWidth the paginator reads.
         The clip margin keeps a 傍点 or a furigana run sitting on the box edge
         from being shaved. */
      .page, .after {
        flex: 0 0 auto;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overflow: clip;
        overflow-clip-margin: 0.5em;
      }
      .page {
        font-family: var(--serif);
        font-size: var(--fs);
        line-height: var(--lh);
        inline-size: min(calc(var(--measure) * 1em), 100%);
        block-size: min(calc(var(--extent) * var(--lh) * 1em + 1px), 100%);
        line-break: strict;
        word-break: normal;
        overflow-wrap: normal;
      }

      /* writing-mode lives HERE, never on body or #track: a flex container's row
         axis follows its own writing mode, so vertical-rl on either would stack
         the three cells instead of laying them in a row, and it would rotate the
         chrome, the sheet and the settings panel with the text.

         The column gap is exactly one full-width character, half of it each side
         of the glyph run. That half is what holds the furigana (0.44em, right of
         the column) and the 傍点 (0.5em, left of it) clear of the neighbouring
         column: the two protrude into the same gap from opposite sides, so the gap
         must carry 0.94em and the arithmetic floor is 1.94. 2 is that floor with
         the rounding paid for, and it is also the traditional 行間＝全角アキ.
         Going below it collides ruby with the next column's glyphs — invisibly to
         every automated check, because the pitch arithmetic still works. */
      body.vertical .page {
        -webkit-writing-mode: vertical-rl;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        --lh: 2;
      }
      body.horizontal .page {
        -webkit-writing-mode: horizontal-tb;
        writing-mode: horizontal-tb;
        --lh: 2.6;
      }

      /* A screen whose single sentence exceeds the box. The paginator lays it
         down anyway rather than spinning, and start-aligns it so the beginning of
         the sentence is the part that survives. Must not change metrics. */
      .page.tight { align-content: start; }

      .page p { margin: 0; text-indent: 0; }
      /* 改行 on: one <p> per sentence. In 縦書き a paragraph break already opens a
         new column, so the break is the separation; 横書き needs a little air
         between consecutive sentences. */
      body.broken.horizontal .page p + p { margin-block-start: 0.5em; }
      /* 改行 off: a <p> is an inferred paragraph holding several sentences.
         Japanese marks a paragraph with a one-character indent rather than with
         space, and a quoted utterance uses its 「 as that indent, so dialogue
         takes none. text-indent applies to BLOCK CONTAINERS ONLY — which is why
         the sentences inside collapse to inline <span class="s"> and the paragraph
         stays a real <p>. A block continuing from the previous screen is not a new
         paragraph and takes no indent either. */
      body.flowing .page p { text-indent: 1em; }
      body.flowing .page p.dialogue,
      body.flowing .page p.cont { text-indent: 0; }

      /* ---- ruby and 傍点 -------------------------------------------------- */
      /* Ruby is always laid out and only its opacity changes. NOTHING below may
         switch display, visibility or font-size on rt: the paginator measures the
         box, so a reveal that reflowed would re-split the page under the reader's
         finger depending on whether ふりがな happens to be on. line-height: 1 is
         what makes the annotation exactly 0.44em deep, which is the number the
         column-gap arithmetic above assumes. */
      ruby { -webkit-ruby-position: before; ruby-position: over; }
      rt {
        font-size: 0.44em;
        line-height: 1;
        color: var(--accent);
        opacity: 0;
        transition: opacity 0.12s ease;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-emphasis: none;
        text-emphasis: none;
      }
      body.furigana .page rt { opacity: 1; }
      /* The tapped word keeps its reading attached to the kanji for as long as its
         sheet is up. Opacity only, so no reflow. */
      .w.lit rt { opacity: 1; }
      /* Approved stretch vocabulary: not yet learned, so the reading is shown
         unconditionally rather than waiting for the ふ gate. README's "The
         reader" section publishes that promise to readers — "teal circles with
         the reading shown" — so it is not an implementation detail to change
         quietly. The 傍点 below replace the underline, not this. */
      .w.new rt { opacity: 1; color: var(--new); }

      /* 傍点 replace both underlines. `under left` is one declaration covering both
         modes — `under` is read only in horizontal typographic modes and `left`
         only in vertical — and it MUST carry both keywords: `under` alone computes
         to `under right`, which in a column puts the sesame on top of the furigana.
         Asserted by the harness as marks/傍点-and-ruby-on-opposite-sides, in both
         writing modes, because nothing about it is visible in the cascade. Never
         bare `filled` or `open` either; those compute to a dot in Chrome and to a
         circle in recent Safari. The colour goes inside the shorthand, which resets it to
         currentColor when omitted. text-emphasis-position is not part of the
         shorthand and is never reset by it, so it is declared separately. */
      .w.weak, .w.new {
        -webkit-text-emphasis-position: under left;
        text-emphasis-position: under left;
      }
      .w.weak {
        -webkit-text-emphasis: filled sesame var(--weak);
        text-emphasis: filled sesame var(--weak);
      }
      .w.new {
        -webkit-text-emphasis: open circle var(--new);
        text-emphasis: open circle var(--new);
      }
      /* No story has one yet, and source order should not be what decides it: a
         word being failed repeatedly is the more urgent mark, and 新出 still says
         its piece through the unconditional reading above. */
      .w.weak.new {
        -webkit-text-emphasis: filled sesame var(--weak);
        text-emphasis: filled sesame var(--weak);
      }

      /* The tapped word or sentence, for as long as its sheet is up. The flat
         declaration is what an engine without color-mix keeps, and it is a neutral
         grey because it has to read against both papers. */
      .w.lit, .s.lit {
        border-radius: 3px;
        background: rgba(128, 128, 128, 0.18);
        background: color-mix(in srgb, var(--accent) 15%, transparent);
      }

      /* Desktop only. Ungated, both of these stick to whatever was last tapped —
         the reported defect in the current file. A translatable sentence still
         gets no permanent marking (a marker on every line would compete with the
         傍点 that carry real information); the cursor appears only while 訳 is
         armed, which is the only time the tap does anything at all. */
      @media (hover: hover) and (pointer: fine) {
        .w:hover rt { opacity: 1; }
        .w:hover {
          border-radius: 3px;
          background: rgba(128, 128, 128, 0.14);
          background: color-mix(in srgb, var(--accent) 12%, transparent);
        }
        body.trans .s.has-en { cursor: pointer; }
      }

      /* ---- あとがき ------------------------------------------------------- */
      /* Its own box, NOT a .page modifier: body.flowing .page p (0,2,2) would beat
         .page.after p (0,2,1) and push a 全角 indent into English prose. The
         renderer swaps the class wholesale, so an afterword box never carries
         `page` at all.

         Ninety-six to ninety-nine per cent of it is English, so it neither rotates
         with 縦書き nor wears the story's serif or type size — at 28px in a 366px
         cell it would be thirteen Latin characters per line. Its furigana is
         glossing for comprehension rather than reading practice, so it stays
         legible whatever the ふ gate says; because .after is outside
         `body.furigana .page rt`, that exemption is structural now rather than the
         ID-specificity accident it was.

         The <details> collapse retires: a <details> cannot straddle a screen
         boundary, and these screens split like any other. The spoiler gate is that
         you reach the afterword only by deliberately turning past the last page,
         and the label below is the first thing on the first afterword screen. */
      .after {
        -webkit-writing-mode: horizontal-tb;
        writing-mode: horizontal-tb;
        font-family: var(--sans);
        font-size: 1rem;
        line-height: 1.7;
        color: var(--ink);
        inline-size: min(34rem, 100%);
        block-size: 100%;
        -webkit-hyphens: auto;
        hyphens: auto;
      }
      .after .after-label {
        display: block;
        margin: 0 0 0.9em;
        color: var(--accent);
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        -webkit-hyphens: none;
        hyphens: none;
      }
      .after rt { font-size: 0.5em; opacity: 0.75; }

      /* ---- chrome: two fixed overlay bars --------------------------------- */
      #top, #bar {
        position: fixed;
        inset-inline: 0;
        z-index: var(--z-chrome);
        display: flex;
        align-items: center;
        background: var(--paper);
        color: var(--muted);
        font-family: var(--sans);
        font-size: 0.85rem;
        /* The reader's writing mode must not reach the controls. */
        writing-mode: horizontal-tb;
        direction: ltr;
        touch-action: manipulation;
        transition: opacity 0.22s ease;
      }
      #top {
        top: 0;
        block-size: var(--top-h);
        gap: 0.6rem;
        padding-block: calc(var(--chrome-gap) + var(--safe-t)) var(--chrome-gap);
        padding-inline: max(0.9rem, var(--safe-l)) max(0.9rem, var(--safe-r));
      }
      #bar {
        bottom: 0;
        block-size: var(--bar-h);
        gap: clamp(0.2rem, 1.2vw, 0.5rem);
        justify-content: space-between;
        padding-block: var(--chrome-gap) calc(var(--chrome-gap) + var(--safe-b));
        padding-inline: max(0.6rem, var(--safe-l)) max(0.6rem, var(--safe-r));
      }
      /* A soft edge rather than a rule: a hard line drawn across a page of
         Japanese reads as a table cell. Not backdrop-filter — it would make its
         own element a containing block for fixed descendants, and iOS 26 samples
         page colour for its toolbar tint. */
      #top::after, #bar::before {
        content: "";
        position: absolute;
        inset-inline: 0;
        block-size: var(--scrim);
        pointer-events: none;
      }
      #top::after { top: 100%; background: linear-gradient(var(--paper), transparent); }
      #bar::before { bottom: 100%; background: linear-gradient(transparent, var(--paper)); }

      /* Hiding changes opacity and inertness, never a box: --top-h and --bar-h
         stay reserved, so a fade can never resize the page box. */
      body.chrome-off #top, body.chrome-off #bar { opacity: 0; pointer-events: none; }

      #toc, #count { flex: 0 0 auto; min-inline-size: 4.4rem; }
      /* The count replaces the retired 2px progress rule, so it is now the only
         progress indicator and takes --ink rather than --muted. tabular-nums stops
         it jittering on every turn. */
      #count {
        text-align: end;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #title {
        flex: 1 1 auto;
        min-inline-size: 0;
        margin: 0;
        font: inherit;
        font-weight: 600;
        color: var(--ink);
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #bar button, a.btn {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 8px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #bar button {
        flex: 0 0 auto;
        min-inline-size: var(--tap);
        block-size: var(--tap);
        padding: 0;
        font-size: 1.05rem;
        line-height: 1;
      }
      /* Styled as a button but an anchor, so it works with no JS and offers a real
         target for open-in-new-tab. */
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        block-size: var(--tap);
        padding-inline: 0.7rem;
        color: var(--muted);
        text-decoration: none;
      }
      /* The lit glyph is the only thing on screen saying a gate is armed, so it is
         a solid fill, not a tint — color-mix would drop the cue entirely where it
         is unsupported. */
      #bar button[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--paper);
      }
      #bar button:disabled { opacity: 0.3; cursor: default; }
      @media (hover: hover) and (pointer: fine) {
        #bar button:hover:not(:disabled):not([aria-pressed="true"]),
        a.btn:hover { border-color: var(--accent); color: var(--accent); }
      }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .gates { display: flex; gap: clamp(0.2rem, 1.2vw, 0.35rem); order: 1; }
      #prev { order: 0; }
      #next { order: 2; }
      /* 右綴じ: the next page lies to the left, so its control does too. Flexbox
         order does not move DOM order, so the tab sequence stays 前 → ふ → 訳 → 意
         → 設 → 次, which is the reading order in either binding. */
      body.bind-right #prev { order: 2; }
      body.bind-right #next { order: 0; }

      /* ---- the disclosure sheet ------------------------------------------- */
      /* A sibling of #track, never a descendant, and horizontal even when the page
         is 縦書き: this is chrome, not text. Physical insets throughout — logical
         inset-* resolve against the containing block's writing mode while logical
         margins resolve against the element's own.

         It sits ABOVE #bar, not under it: arming 意 with a word already open is
         the shortest route to its meaning, so the nav has to stay reachable and
         the sheet has to survive the tap (see data-keep-sheet). */
      #sheet {
        position: fixed;
        z-index: var(--z-sheet);
        left: max(0.75rem, var(--safe-l));
        right: max(0.75rem, var(--safe-r));
        bottom: calc(var(--bar-h) + 0.5rem);
        max-width: 34rem;
        margin-left: auto;
        margin-right: auto;
        writing-mode: horizontal-tb;
        direction: ltr;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        font-family: var(--sans);
        font-size: 0.85rem;
        line-height: 1.55;
        /* Never engages on the shipped corpus — glosses are capped at 120 chars and
           the longest translation is 146 — but a large OS text size is the one case
           where losing the bottom of a gloss would matter. contain stops any scroll
           chaining to the locked document. */
        max-height: 40vh;
        max-height: 40dvh;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        /* The track is user-select: none on touch, so this is the only place a
           selection can start — and copying a gloss into Anki is a real use. */
        -webkit-user-select: text;
        user-select: text;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.16s ease, transform 0.16s ease;
      }
      #sheet.on { opacity: 1; transform: none; }
      #sheet-head { display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
      #sheet-word { font-family: var(--serif); font-size: 1.35rem; line-height: 1.25; }
      #sheet-kana { color: var(--accent); font-size: 0.95rem; }
      #sheet-tags { display: flex; gap: 0.3rem; margin-left: auto; }
      #sheet-tags .tag {
        font-size: 0.66rem;
        letter-spacing: 0.05em;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 0.05rem 0.45rem;
      }
      #sheet-tags .tag.weak { color: var(--weak); }
      #sheet-tags .tag.new { color: var(--new); }

      /* ---- settings ------------------------------------------------------- */
      /* A <dialog>, for the free focus trap, backdrop, Escape and inert-ing of the
         page behind it — which also stops the track's pointer handlers firing.
         Where showModal is missing it opens non-modally over #veil instead. */
      #settings {
        position: fixed;
        inset: auto 0 0 0;
        z-index: var(--z-panel);
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        inline-size: 100%;
        max-inline-size: 27rem;
        max-block-size: min(86vh, 44rem);
        max-block-size: min(86dvh, 44rem);
        padding: 0;
        border: 0;
        border-radius: 14px 14px 0 0;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.22);
        font-family: var(--sans);
        font-size: 0.92rem;
        writing-mode: horizontal-tb;
        direction: ltr;
        overflow: hidden;
      }
      /* display:flex above beats the UA's dialog:not([open]) rule, so the panel
         ships open without this. */
      #settings:not([open]) { display: none; }
      /* Opened with focus on the panel itself, so no control wears a keyboard ring
         the moment a thumb opens it. */
      #settings:focus { outline: none; }
      /* The var() fallback covers engines where ::backdrop does not inherit custom
         properties from the element it belongs to. */
      #settings::backdrop { background: var(--veil, rgba(20, 18, 16, 0.4)); }
      #veil {
        position: fixed;
        inset: 0;
        z-index: var(--z-veil);
        background: var(--veil);

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex: 0 0 auto;

      .phead h2 { margin: 0; font: inherit; font-size: 1rem; font-weight: 600; }
      #settings-close {
        font: inherit;
        inline-size: var(--tap);
        block-size: var(--tap);
        padding: 0;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;

        overflow-y: auto;

        padding: 0 1rem calc(1rem + var(--safe-b));

        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;

        justify-content: space-between;
        gap: 1rem;
        padding-block: 0.35rem;
      }
      .row + .row { border-block-start: 1px solid var(--rule); }
      .rlabel { flex: 0 1 auto; color: var(--ink); }
      .rlabel small { display: block; font-size: 0.76rem; color: var(--muted); }

      .seg {
        display: flex;
        flex: 0 1 auto;
        border: 1px solid var(--rule);
        border-radius: 9px;
        overflow: hidden;
      }
      .seg label { position: relative; display: block; flex: 0 1 auto; }
      /* Kept rendered and focusable — display:none or visibility:hidden would take
         the radios out of the tab order and lose native arrow-key group
         navigation. */
      .seg input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .seg span {
        display: flex;
        align-items: center;
        justify-content: center;
        min-block-size: var(--tap);
        padding-inline: 0.72rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .seg label + label span { border-inline-start: 1px solid var(--rule); }
      .seg input:checked + span { background: var(--accent); color: var(--paper); }
      .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -3px; }

      input.sw {

        block-size: 24px;

        border-radius: 999px;
        background: transparent;

        left: 2px;
        width: 18px;
        height: 18px;

k":"えらぶ","g":"to choose; to select"},{"t":"権利","r":[["権利","けんり"]],"k":"けんり","g":"right; privilege"},{"t":"だった"},{"t":"の"},{"t":"だ"},{"t":"と"},{"t":"、"},{"t":"今","r":[["今","いま"]],"k":"いま","g":"now; the present time; just now; soon; immediately; another; more"},{"t":"は"},{"t":"分かる","r":[["分","わ"],["かる",null]],"k":"わかる","g":"to understand; to comprehend; to grasp; to see; to get; to follow; to become clear; to be known; to be discovered; to be"},{"t":"。"}],"en":"It was the right to choose. I understand that now."}]],"stats":{"words":715,"translated":168,"sentences":168,"weak":["お前","後","流す","渡す","策","表","襲う","計画","起きる","過ぎる"],"approved":["二百段","叫ぶ","従う","王","罰"],"unknown":[],"knownVocab":6502}};
      const $ = (id) => document.getElementById(id);

      // ------------------------------------------------------------ storage --
      // Both keys live in the device's localStorage, so neither can be reached
      // from file:// — a mailed copy and the --split harness both run there, and
      // Safari throws on the accessor itself rather than on the call. Nothing
      // below dereferences localStorage outside a try, and once it has thrown
      // the reader carries on with the session's values held in memory.
      const Store = (() => {
        const PREFIX = "japanese-stories:";
        // ?nostore makes the degradation check reproducible on any browser and
        // any origin, rather than depending on file:// throwing on the one being
        // tested. Nobody types it by accident.
        let dead = location.search.indexOf("nostore") >= 0;
        const flushes = [];

        const plain = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

        const readJSON = (key) => {
          if (dead) return null;
          let text;
          try {
            text = localStorage.getItem(PREFIX + key);
          } catch (e) {
            dead = true;
            return null;
          }
          if (!text) return null;
          try {
            const value = JSON.parse(text);
            return plain(value) ? value : null;
          } catch (e) {
            return null; // hand-edited or half-written; the defaults are right
          }
        };

        // Firefox names a full quota NS_ERROR_DOM_QUOTA_REACHED rather than
        // QuotaExceededError, and the DOMException code differs as well — 22
        // against 1014 — so both names are matched and the code is not read.
        const isFull = (e) =>
          !!e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED");

        const writeJSON = (key, value) => {
          if (dead) return false;
          try {
            localStorage.setItem(PREFIX + key, JSON.stringify(value));
            return true;
          } catch (e) {
            // A store that refuses to write at all is dead and says so once. A
            // FULL one is not: it still works, this one value did not fit, and
            // the next write may well succeed. They are one flag apart and the
            // difference is the whole session — twelve readers share one origin
            // and one progress map that is never pruned, so a quota reached
            // while writing progress would also stop the type size, the writing
            // mode and the theme persisting, silently, until the tab is closed.
            // The cost of not latching is one caught exception per attempt on a
            // store that is permanently full, and both writers are debounced.
            if (!isFull(e)) dead = true;
            return false;
          }
        };

        // A write deferred past the turn that caused it. Progress is written on
        // every page turn and localStorage is synchronous; writing inside the
        // snap animation is a dropped frame on the one interaction that has to
        // feel smooth.
        const defer = (fn, ms) => {
          let timer = 0;
          const run = () => {
            if (!timer) return;
            clearTimeout(timer);
            timer = 0;
            fn();
          };
          flushes.push(run);
          return () => {
            if (timer) clearTimeout(timer);
            timer = setTimeout(run, ms);
          };
        };

        const flush = () => {
          for (const run of flushes) run();
        };
        // pagehide and visibilitychange rather than unload: iOS Safari fires
        // neither unload nor beforeunload when the app is swiped away or the
        // page enters the back/forward cache.
        addEventListener("pagehide", flush);
        addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") flush();
        });

        // Fires only in the other tabs, never in the one that wrote. A null key
        // is localStorage.clear(), which counts as a change to everything.
        const listen = (key, fn) => {
          addEventListener("storage", (e) => {
            if (e.key === null || e.key === PREFIX + key) fn();
          });
        };

        return {
          plain,
          readJSON,
          writeJSON,
          defer,
          flush,
          listen,
          ok: () => !dead,
        };
      })();

      // -------------------------------------------------------------- prefs --
      const Prefs = (() => {
        const V = 1;
        const WRITING = ["vertical", "horizontal"];
        const BINDING = ["auto", "right", "left"];
        const THEME = ["system", "light", "dark"];
        const FONT_STEPS = [22, 25, 28, 32, 36, 40];
        // Not the range the settings panel offers — a guard, so a hand-edited or
        // half-migrated value cannot hand the paginator a size at which a single
        // sentence does not fit the box and the fill loop has nothing to place.
        const FONT_MIN = 14;
        const FONT_MAX = 48;

        const defaults = () => ({
          writingMode: "vertical",
          // 改行 is stored per writing mode because the right answer differs by
          // mode rather than by taste: 縦書き on a phone reaches a 26-character
          // measure and reads as prose, 横書き reaches 12 and only works one
          // sentence to the line.
          linebreaks: { vertical: false, horizontal: true },
          binding: "auto",
          fontSize: 28,
          theme: "system",
          furigana: false,
          trans: false,
          meaning: false,
        });

        const oneOf = (list) => (v) => (list.indexOf(v) >= 0 ? v : undefined);
        const bool = (v) => (typeof v === "boolean" ? v : undefined);
        const size = (v) =>
          typeof v === "number" && isFinite(v)
            ? Math.min(FONT_MAX, Math.max(FONT_MIN, Math.round(v)))
            : undefined;
        const marks = (v) => {
          if (!Store.plain(v)) return undefined;
          const d = defaults().linebreaks;
          return {
            vertical: typeof v.vertical === "boolean" ? v.vertical : d.vertical,
            horizontal: typeof v.horizontal === "boolean" ? v.horizontal : d.horizontal,
          };
        };

        // fx is what a change to the field actually costs, and it is the whole
        // reason this layer notifies instead of letting callers poll:
        //   layout  — screens must be rebuilt from DATA and re-split
        //   binding — the turn direction may have flipped; nothing reflows
        //   theme   — custom properties only
        //   gates   — ふ/訳/意. Ruby is always laid out and only its opacity
        //             moves, so arming furigana must never repaginate: the
        //             paginator measures overflow, and a reflow here would move
        //             sub-screen boundaries under the reader's finger.
        const FIELDS = {
          writingMode: { ok: oneOf(WRITING), fx: ["layout", "binding"] },
          linebreaks: { ok: marks, fx: ["layout"] },
          binding: { ok: oneOf(BINDING), fx: ["binding"] },
          fontSize: { ok: size, fx: ["layout"] },
          theme: { ok: oneOf(THEME), fx: ["theme"] },
          furigana: { ok: bool, fx: ["gates"] },
          trans: { ok: bool, fx: ["gates"] },
          meaning: { ok: bool, fx: ["gates"] },
        };

        let state = defaults();
        let snapshot = null;
        let rest = {};
        const subs = [];

        // Adding and removing fields is free, because each one is validated on
        // its own against the default: a record written by a newer build loads
        // field by field rather than all or nothing. So v only has to cover what
        // that cannot absorb — a field whose meaning changes under a stable
        // name. Rename the field instead and this stays empty. A step added here
        // must only fill in what is absent: an older engine re-stamps v on every
        // write, so 1 -> 2 can meet a record that has already been through it.
        const MIGRATE = {};

        // Unrecognised keys are carried through untouched, so an older engine —
        // docs/versions/ ships five, on the same origin — cannot strand a newer
        // build's settings the next time it writes one of its own.
        const load = () => {
          const out = defaults();
          rest = {};
          let raw = Store.readJSON("prefs");
          if (!raw) return out;
          for (let v = typeof raw.v === "number" ? raw.v : V; MIGRATE[v]; v++) raw = MIGRATE[v](raw);
          for (const key of Object.keys(raw)) {
            if (key === "v") continue;
            if (!FIELDS[key]) {
              rest[key] = raw[key];
              continue;
            }
            const value = FIELDS[key].ok(raw[key]);
            if (value !== undefined) out[key] = value;
          }
          return out;
        };

        const save = Store.defer(() => {
          Store.writeJSON("prefs", Object.assign({}, rest, state, { v: V }));
        }, 150);

        const vertical = () => state.writingMode === "vertical";
        const linebreaks = () => state.linebreaks[state.writingMode];
        const density = () => (linebreaks() ? "broken" : "flowing");
        // 自動: 縦書き is bound on the right and turns leftward like a Japanese
        // book, 横書き on the left and turns rightward like a Western one. Every
        // consumer that needs a direction derives it from here rather than from
        // the writing mode, or the drag, the arrows and the nav will disagree
        // under an override.
        const bindingEdge = () =>
          state.binding === "auto" ? (vertical() ? "right" : "left") : state.binding;

        const apply = () => {
          const c = document.body.classList;
          c.toggle("vertical", vertical());
          c.toggle("horizontal", !vertical());
          c.toggle("broken", linebreaks());
          c.toggle("flowing", !linebreaks());
          c.toggle("bind-right", bindingEdge() === "right");
          c.toggle("bind-left", bindingEdge() === "left");
          for (const key of ["furigana", "trans", "meaning"]) c.toggle(key, state[key]);
          const root = document.documentElement;
          // The dark palette is a media query, so an explicit choice has to
          // out-specify it rather than replace it. No attribute means follow the
          // OS, which is what the query alone already did.
          if (state.theme === "system") root.removeAttribute("data-theme");
          else root.setAttribute("data-theme", state.theme);
          // px, not rem: the setting has to be what the type measures, which is
          // what the type-fidelity check asserts. The cost is that the browser's
          // own text-size setting no longer scales the story — this control
          // replaces it, and unlike the browser's it is one tap away.
          root.style.setProperty("--fs", state.fontSize + "px");
        };

        const freeze = () =>
          Object.freeze(
            Object.assign({}, state, {
              linebreaks: Object.freeze(Object.assign({}, state.linebreaks)),
            })
          );

        const commit = (keys, external) => {
          if (!keys.length) return;
          snapshot = freeze();
          const effects = { layout: false, binding: false, theme: false, gates: false };
          for (const key of keys) for (const fx of FIELDS[key].fx) effects[fx] = true;
          // Classes and custom properties land before anyone is told, because a
          // subscriber that hears "layout" measures the box immediately and has
          // to measure it in the new writing mode, not the old one.
          apply();
          if (!external) save();
          const change = { keys: keys, effects: effects, prefs: snapshot, external: !!external };
          for (const fn of subs.slice()) {
            try {
              fn(change);
            } catch (e) {
              // One dead subscriber must not leave the rest of the reader
              // showing the previous state. Rethrow out of band so the failure
              // still reaches the console.
              setTimeout(() => {
                throw e;
              });
            }
          }
        };

        // linebreaks is the only field that is not a scalar.
        const same = (key, a, b) =>
          key === "linebreaks" ? a.vertical === b.vertical && a.horizontal === b.horizontal : a === b;

        const stage = (key, value) => {
          const field = FIELDS[key];
          if (!field) return false;
          const next = field.ok(value);
          // A settings control re-emits the value it already holds on every
          // interaction, and repaginating for that shows as a stutter.
          if (next === undefined || same(key, state[key], next)) return false;
          state[key] = next;
          return true;
        };

        const set = (key, value) => {
          if (!stage(key, value)) return false;
          commit([key]);
          return true;
        };

        const setAll = (patch) => {
          const keys = [];
          for (const key of Object.keys(patch)) if (stage(key, patch[key])) keys.push(key);
          commit(keys);
          return keys.length;
        };

        const toggle = (key) => set(key, !state[key]);

        const setLinebreaks = (on) => {
          const next = Object.assign({}, state.linebreaks);
          next[state.writingMode] = !!on;
          return set("linebreaks", next);
        };

        // The panel offers discrete steps rather than a slider: every accepted
        // write notifies synchronously and repaginates, and a slider would do
        // that once per pixel.
        const stepFont = (d) => {
          // Take the next rung on the side pressed rather than stepping from an
          // index: a size off the ladder — a hand-edited store, or one the
          // FONT_MIN clamp produced — has no index, and a guessed one walks the
          // wrong way or skips the rung the reader was asking for.
          const cur = state.fontSize;
          const side = FONT_STEPS.filter((s) => (d > 0 ? s > cur : s < cur));
          const next = side.length
            ? (d > 0 ? side[0] : side[side.length - 1])
            : FONT_STEPS[d > 0 ? FONT_STEPS.length - 1 : 0];
          return set("fontSize", next);
        };

        const subscribe = (fn) => {
          subs.push(fn);
          return () => {
            const i = subs.indexOf(fn);
            if (i >= 0) subs.splice(i, 1);
          };
        };

        const adopt = () => {
          const before = state;
          state = load();
          const keys = [];
          for (const key of Object.keys(FIELDS)) if (!same(key, before[key], state[key])) keys.push(key);
          commit(keys, true);
        };

        const boot = () => {
          state = load();
          snapshot = freeze();
          apply();
          // Two stories in two tabs share one prefs key; without this the second
          // tab keeps rendering at the old size until it is reloaded.
          Store.listen("prefs", adopt);
          return snapshot;
        };

        snapshot = freeze();

        return {
          FONT_STEPS,
          boot,
          subscribe,
          get: () => snapshot,
          set,
          setAll,
          toggle,
          vertical,
          linebreaks,
          setLinebreaks,
          stepFont,
          density,
          bindingEdge,
        };
      })();

      // ----------------------------------------------------------- progress --
      const Progress = (() => {
        // page is 1-based — the number the reader shows — so the record reads
        // correctly in devtools. sub stays 0-based: it indexes the screens a
        // page was split into, and 0 is its value on every page that did not
        // split.
        //
        // Whether a story is FINISHED is decided here and nowhere else, and it
        // is written into the record as `done`. Reaching the last authored page
        // is not enough — that page may be split across screens, and it usually
        // is on a phone — so the contents page emitted by index.py reads this
        // field rather than re-deriving it from page and of. Re-deriving it is
        // what made a 23-page story read 読了 with a screen still to go.
        let slug = "";
        let of = 0;
        let done = false;
        let rec = null;

        const flush = Store.defer(() => {
          if (!rec) return;
          // Re-read rather than hold the map: another tab may be reading another
          // story into the same key, and every write rewrites the whole object.
          // Nothing is ever pruned — this reader cannot know which of the other
          // slugs are live stories, and one of them is its own archived version.
          const all = Store.readJSON("progress") || {};
          all[slug] = rec;
          Store.writeJSON("progress", all);
        }, 400);

        // No slug means no tracking. A build made before build.py started
        // emitting one has no stable identity, and falling back to the title
        // would merge an archived version's progress into the current story,
        // whose page count is different.
        const open = (storySlug, pageCount) => {
          slug = storySlug || "";
          of = Math.max(1, Math.round(pageCount) || 1);
          const all = slug ? Store.readJSON("progress") || {} : {};
          const saved = Store.plain(all[slug]) ? all[slug] : null;
          done = !!(saved && saved.done === true);
          let pageIndex = 0;
          let sub = 0;
          if (saved && typeof saved.page === "number" && isFinite(saved.page)) {
            // Clamped here because this is the entry path, and nothing else on
            // it range-checks: a stored index against a story that has been
            // rewritten since would index past DATA.pages and throw before the
            // first screen renders.
            pageIndex = Math.min(of - 1, Math.max(0, Math.round(saved.page) - 1));
            // A different page count means the story changed, so which screen of
            // that page the reader was on no longer refers to anything.
            if (saved.of === of && typeof saved.sub === "number" && isFinite(saved.sub)) {
              sub = Math.max(0, Math.round(saved.sub));
            }
          }
          return { pageIndex: pageIndex, sub: sub };
        };

        // subCount is how many screens the authored page's own content produced.
        // あとがき screens carry the last page's index and continue sub past that
        // count, so arriving at one reads as done without needing a second flag.
        const mark = (pageIndex, sub, subCount) => {
          if (!slug) return;
          const idx = isFinite(pageIndex) ? Math.max(0, Math.round(pageIndex)) : 0;
          const s = isFinite(sub) ? Math.max(0, Math.round(sub)) : 0;
          if (idx >= of - 1 && s >= (subCount || 1) - 1) done = true;
          rec = {
            page: Math.min(of, idx + 1),
            sub: s,
            of: of,
            // Sticky: finishing a story is a fact about the story, and a re-read
            // resumes where it is without erasing it.
            done: done,
            at: Date.now(),
          };
          flush();
        };

        return { open, mark };
      })();

      // ------------------------------------------------------------ pagebox --
      // The page box is constant in CELLS, not in pixels: a measure (characters
      // per column in 縦書き, per line in 横書き) floored by what the viewport
      // allows and capped at the Japanese typographic 45, and an extent (columns
      // / lines) capped so the median 88-character authored page fills it around
      // 70%. That is why a 1440 laptop and a 390 phone show the same page with
      // different margins rather than a wider page.
      const PageBox = (() => {
        const MEASURE_CAP = 45; // upper end of the 35-45 Japanese measure
        const MEASURE_FLOOR = 6; // below this nothing is readable anyway
        const TARGET_CELLS = 170; // median page is 88 chars -> ~70% column fill
        const EXTENT_MIN = 3;
        const EXTENT_MAX = 12; // without it, phone 横書き is a 12x15 wall

        const root = document.documentElement;
        const listeners = new Set();

        let track = null;
        let host = null;
        let probe = null;
        let suspended = false;
        let pending = false;
        let raf = 0;

        let m = {
          measure: 30, extent: 6, cells: 180, room: 6, cap: 6,
          fs: 28, advance: 56, vertical: true, cellW: 0, cellH: 0,
        };

        // The measuring cell's content box is the available area: viewport minus
        // the chrome reserve minus the safe-area insets, all resolved by CSS. No
        // JS here needs to know a safe area exists.
        const contentBox = (el) => {
          const cs = getComputedStyle(el);
          const r = el.getBoundingClientRect();
          return {
            w: Math.max(0, r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)),
            h: Math.max(0, r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)),
          };
        };

        // Read the USED font-size and line-height off the probe rather than the
        // pref number, so the arithmetic cannot drift from what the browser laid
        // out and the per-mode --lh is picked up for free.
        function compute() {
          const cs = getComputedStyle(probe);
          const fs = parseFloat(cs.fontSize) || 16;
          let advance = parseFloat(cs.lineHeight);
          if (!(advance > 0)) advance = fs * 2;
          const vertical = cs.writingMode.indexOf("vertical") === 0;

          const a = contentBox(probe.parentNode);
          const inlineRoom = vertical ? a.h : a.w;
          const blockRoom = vertical ? a.w : a.h;

          const measure = Math.max(
            MEASURE_FLOOR,
            Math.min(MEASURE_CAP, Math.floor(inlineRoom / fs))
          );
          const room = Math.max(1, Math.floor(blockRoom / advance));
          const cap = Math.max(
            EXTENT_MIN,
            Math.min(EXTENT_MAX, Math.ceil(TARGET_CELLS / measure))
          );
          const extent = Math.min(room, cap);

          return {
            measure, extent, cells: measure * extent, room, cap,
            fs, advance, vertical, cellW: a.w, cellH: a.h,
          };
        }

        // Only the integer tuple and the cell size matter to anyone else, so the
        // change test is the debounce — there is no timer, because a stale box
        // after a rotation would race the gesture layer.
        function refresh(force) {
          if (!probe) return m;
          if (suspended) { pending = true; return m; }

          // Recompute against the values already written, so a measure the CSS
          // clamped to 100% is re-derived from the clamp rather than compounding.
          const next = compute();
          root.style.setProperty("--measure", String(next.measure));
          root.style.setProperty("--extent", String(next.extent));

          const changed =
            force === true ||
            next.measure !== m.measure ||
            next.extent !== m.extent ||
            next.vertical !== m.vertical ||
            Math.abs(next.fs - m.fs) > 0.01 ||
            Math.abs(next.cellW - m.cellW) > 0.5 ||
            Math.abs(next.cellH - m.cellH) > 0.5;

          const prev = m;
          m = next;
          if (changed) {
            for (const fn of listeners) {
              try { fn(m, prev); } catch (e) { /* a bad listener must not stop layout */ }
            }
          }
          return m;
        }

        function schedule() {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = 0;
            refresh(false);
          });
        }

        // How far a box may overrun and still count as fitting. On the block axis
        // that is what can protrude past the last line box, never the pitch of a
        // line: ruby (0.44em) and 傍点 (0.5em) sit inside the half-leading at
        // every line-height this design permits — the whole argument for the 1.94
        // floor — so the allowance is a rounding guard of one pixel, and it grows
        // only if someone drops --lh below that floor. Half a line advance, the
        // number this replaces, licensed 1.0em in 縦書き and 1.3em in 横書き:
        // enough to lay a broken-横書き page two paragraph margins over the box
        // and let the clip shave the line beneath them, and enough to swallow a
        // whole あとがき line. The clip margin stays what it was for — ink on the
        // box edge — rather than being spent on layout.
        //
        // On the inline axis 禁則処理 can push a 約物 one character past the end of
        // a line, and moving that line to another screen does not cure it, so one
        // character it stays.
        //
        // The allowance belongs to the BOX, never to the page: .after lays out
        // horizontal-tb at 1rem/1.7 whatever the story is set to, and the page's
        // 56px line accepted an あとがき prefix a full line over the box — which
        // overflow: clip then deleted for good.
        //
        // scrollWidth/scrollHeight/clientWidth/clientHeight are unsigned and
        // interoperable in both writing modes; scrollLeft's sign is not, and is
        // never read anywhere in this file.
        function boxSlack(el) {
          const cs = getComputedStyle(el);
          const fs = parseFloat(cs.fontSize) || 16;
          let advance = parseFloat(cs.lineHeight);
          if (!(advance > 0)) advance = fs * 1.2;
          const ink = Math.max(1, (0.5 - (advance / fs - 1) / 2) * fs);
          return cs.writingMode.indexOf("vertical") === 0
            ? { w: ink, h: fs }
            : { w: fs, h: ink };
        }

        function overflows(el, slack) {
          const s = slack || boxSlack(el);
          return (
            el.scrollWidth - el.clientWidth > s.w ||
            el.scrollHeight - el.clientHeight > s.h
          );
        }

        // Every page break in the book is decided by scrollWidth/scrollHeight on
        // the probe. If an engine reports the padding box instead, nothing ever
        // overflows, nothing ever splits, and the only symptom is text quietly
        // shaved off the bottom of every long page. Say so at boot instead.
        function selfTest() {
          if (!probe) return false;
          probe.className = "page";
          probe.textContent = "";
          const p = document.createElement("p");
          p.textContent = "あ".repeat(Math.max(m.cells, 40) * 3);
          probe.append(p);
          const ok = overflows(probe);
          probe.textContent = "";
          return ok;
        }

        function init() {
          track = $("track");
          if (!track) throw new Error("PageBox: #track missing");

          // Built here rather than in reader.html: build.py's render_split
          // matches reader.html by whole indented block, and every node added
          // there is one more chance to break the harness silently. It is a body
          // child, never a descendant of the track — the track carries a live
          // transform, which would make it the containing block for a fixed
          // descendant.
          host = document.createElement("div");
          host.id = "measure";
          host.setAttribute("aria-hidden", "true");
          if ("inert" in host) host.inert = true;
          const cell = document.createElement("div");
          cell.className = "cell";
          probe = document.createElement("div");
          probe.className = "page";
          cell.append(probe);
          host.append(cell);
          document.body.append(host);

          // #measure is fixed at inset 0 and its .cell is absolute at inset 0, so
          // both resolve to exactly the box a live cell resolves to. Nothing is
          // pinned from JS; one set of CSS rules sizes both.
          new ResizeObserver(schedule).observe(track);
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", schedule);
          }
          window.addEventListener("orientationchange", schedule);
          // System fonts resolve synchronously, but a platform that substitutes
          // late would change the metrics the first pagination was measured
          // against, and a boundary would move under the reader.
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(schedule, () => {});
          }
          return refresh(true);
        }

        return {
          init,
          refresh: () => refresh(false),
          metrics: () => m,
          measureBox: () => probe,
          overflows,
          boxSlack,
          selfTest,
          onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },

          // iOS fires viewport resizes mid-gesture (toolbar, rubber-band). A
          // geometry change there would repaginate under the reader's finger, so
          // the track freezes this for the length of a drag; anything that
          // arrived meanwhile is coalesced into one notification.
          suspend() { suspended = true; },
          resume() {
            suspended = false;
            if (pending) { pending = false; refresh(false); }
          },

          // For the verification pass: one line per geometry, console-readable.
          report() {
            return (
              (m.vertical ? "縦" : "横") + " " + m.fs + "px/" + (m.advance / m.fs).toFixed(2) +
              " cell " + Math.round(m.cellW) + "x" + Math.round(m.cellH) +
              " measure " + m.measure + " extent " + m.extent +
              " (room " + m.room + ", cap " + m.cap + ") = " + m.cells + " cells"
            );
          },
        };
      })();

      // ---------------------------------------------------------- paginator --
      // The authored page is an atom: it may split across screens, it is never
      // merged with another, and nothing ever crosses an authored break. The page
      // count is validated against the brief by stats.py and the afterwords cite
      // pages by number in published prose, so the number has to keep meaning
      // what it meant.
      const Paginator = (() => {
        const SEP = "·";
        const AFTER_MARK = "後";
        // Carried verbatim from the reader this replaces.
        const AFTER_LABEL = "あとがき — what this was doing (spoilers)";

        const total = DATA.pages.length;

        let mpage = null;
        let dirty = true;
        let key = "";
        let flowing = false;

        const cache = new Map(); // authored page index -> Screen[]
        const plans = new Map(); // authored page index -> block plan
        let atomList = null; // afterword atoms, geometry-independent
        let afterRuns = null; // afterword screen ranges, geometry-dependent
        let pageSlack = null; // each box's own overflow tolerance, read from it
        let afterSlack = null;

        // Everything that can change where a page breaks. Furigana is absent on
        // purpose: ruby is always laid out and only its opacity changes, so
        // arming ふりがな must not move a single boundary.
        function ensure() {
          if (!mpage) mpage = PageBox.measureBox();
          if (!dirty) return false;
          dirty = false;
          const g = PageBox.metrics();
          const k = [
            g.measure, g.extent, g.vertical ? "v" : "h",
            Prefs.density(), g.fs,
          ].join("/");
          if (k === key) return false;
          key = k;
          flowing = Prefs.density() === "flowing";
          cache.clear();
          afterRuns = null;
          pageSlack = null;
          afterSlack = null;
          return true;
        }

        // ------------------------------------------------------------ markup

        function isDialogue(sent) {
          const t = (sent.toks[0] && sent.toks[0].t) || "";
          const c = t.charAt(0);
          return c === "「" || c === "『";
        }

        // Each quoted utterance is its own paragraph; narration runs merge.
        // Grouping a run of 「 lines into one block would erase the speaker
        // alternation that is the only attribution 終電 has — 40 of its 41 quoted
        // lines carry none, and six of its pages are one unbroken run.
        function blockPlan(sents) {
          const kinds = [], owner = [];
          let block = -1, prevNarration = false;
          for (let i = 0; i < sents.length; i++) {
            const d = isDialogue(sents[i]);
            if (d || !prevNarration) {
              block++;
              kinds.push(d ? "dialogue" : "narration");
            }
            owner.push(block);
            prevNarration = !d;
          }
          return { kinds: kinds, owner: owner };
        }

        function planOf(i) {
          let p = plans.get(i);
          if (!p) {
            p = blockPlan(DATA.pages[i]);
            plans.set(i, p);
          }
          return p;
        }

        // tokFrom/tokTo are a whole sentence except on the two screens either side
        // of a sentence the box could not hold in one piece.
        function sentenceEl(sent, tokFrom, tokTo) {
          const s = document.createElement("span");
          s.className = sent.en ? "s has-en" : "s";
          if (sent.en) s.dataset.en = sent.en;
          for (let ti = tokFrom; ti < tokTo; ti++) {
            const tok = sent.toks[ti];
            if (!tok.r) {
              // A raw chunk can be a lone kanji Ichiran did not tokenise, or a
              // single ASCII space inside a name. Both go through verbatim.
              s.append(document.createTextNode(tok.t));
              continue;
            }
            const w = document.createElement("span");
            w.className = "w" + (tok.w ? " weak" : "") + (tok.n ? " new" : "");
            // The sheet reads the headword from here. textContent would
            // concatenate the <rt> kana into it and print 私わたし【わたし】.
            w.dataset.t = tok.t;
            w.dataset.kana = tok.k || "";
            w.dataset.gloss = tok.g || "";
            for (const pair of tok.r) {
              const text = pair[0], ruby = pair[1];
              if (!ruby) {
                w.append(document.createTextNode(text));
                continue;
              }
              const r = document.createElement("ruby");
              r.append(document.createTextNode(text));
              const rt = document.createElement("rt");
              rt.textContent = ruby;
              r.append(rt);
              w.append(r);
            }
            s.append(w);
          }
          return s;
        }

        // Narration blocks stay block-level <p> in both densities: text-indent
        // applies to block containers only, so a narration run turned into a span
        // would lose its 全角 indent with no error and no visual cue.
        function buildText(i, from, to, flow, head, tail) {
          const frag = document.createDocumentFragment();
          const sents = DATA.pages[i];
          const lo = (k) => (k === from ? head : 0);
          const hi = (k) => (k === to - 1 && tail >= 0 ? tail : sents[k].toks.length);
          if (!flow) {
            for (let k = from; k < to; k++) {
              const p = document.createElement("p");
              p.className = isDialogue(sents[k]) ? "dialogue" : "narration";
              p.append(sentenceEl(sents[k], lo(k), hi(k)));
              frag.append(p);
            }
            return frag;
          }
          const plan = planOf(i);
          // A screen may open in the middle of a narration block. That block is a
          // continuation, not a new paragraph, so it must not be indented — and a
          // screen opening inside a sentence is a continuation whatever the block
          // plan says.
          const cont = head > 0 || (from > 0 && plan.owner[from - 1] === plan.owner[from]);
          let p = null, owner = -1;
          for (let k = from; k < to; k++) {
            if (plan.owner[k] !== owner) {
              owner = plan.owner[k];
              p = document.createElement("p");
              p.className = plan.kinds[owner] + (k === from && cont ? " cont" : "");
              frag.append(p);
            }
            p.append(sentenceEl(sents[k], lo(k), hi(k)));
          }
          return frag;
        }

        // The afterword is one HTML string with no sentence structure exposed, so
        // it splits at word granularity instead. <template> parses it inert; the
        // markup is build-time output of indexmd.ruby_html and carries only
        // <ruby>/<rt>, everything else escaped. This is the reader's only
        // innerHTML site; en and gloss strings never go near it.
        function atoms() {
          if (atomList) return atomList;
          atomList = [];
          if (!DATA.afterword) return atomList;
          const label = document.createElement("p");
          label.className = "after-label";
          label.textContent = AFTER_LABEL;
          atomList.push(label);
          const t = document.createElement("template");
          t.innerHTML = DATA.afterword;
          for (const node of Array.from(t.content.childNodes)) {
            if (node.nodeType === 3) {
              const parts = node.data.match(/\S+\s*|\s+/g) || [];
              for (const part of parts) atomList.push(document.createTextNode(part));
            } else {
              atomList.push(node.cloneNode(true));
            }
          }
          return atomList;
        }

        function buildAfter(from, to) {
          const frag = document.createDocumentFragment();
          const list = atoms();
          for (let i = from; i < to; i++) frag.append(list[i].cloneNode(true));
          return frag;
        }

        // ---------------------------------------------------------- splitting

        function fitsText(i, from, to, head, tail) {
          mpage.className = "page";
          mpage.textContent = "";
          mpage.append(buildText(i, from, to, flowing, head, tail));
          // Read with the class on, so the tolerance is this box's own.
          if (!pageSlack) pageSlack = PageBox.boxSlack(mpage);
          return !PageBox.overflows(mpage, pageSlack);
        }

        function fitsAfter(from, to) {
          mpage.className = "after";
          mpage.textContent = "";
          mpage.append(buildAfter(from, to));
          if (!afterSlack) afterSlack = PageBox.boxSlack(mpage);
          return !PageBox.overflows(mpage, afterSlack);
        }

        // Fill until overflow, measured from the whole remainder down rather than
        // from one sentence up: at the default size most authored pages fit whole,
        // and that case then costs exactly one forced layout. Only when it fails
        // does this binary-search the longest prefix that fits, which is sound
        // because the fit is monotone in the prefix length — text only ever grows.
        //
        // The afterword's units are words, so one of them failing to fit is a
        // 34rem box narrower than a single word and there is nothing finer to
        // fall back to. The story's units are sentences, which is why splitText
        // below has one more level.
        function split(fits, count) {
          const runs = [];
          let from = 0;
          while (from < count) {
            if (fits(from, count)) {
              runs.push({ from: from, to: count, tight: false });
              break;
            }
            // At least one unit is always placed. A unit too long for the box is
            // laid down anyway and marked tight; testing and skipping would be a
            // loop that cannot make progress.
            let lo = 1, hi = count - from - 1, best = 1, ok = false;
            while (lo <= hi) {
              const mid = (lo + hi) >> 1;
              if (fits(from, from + mid)) {
                best = mid;
                ok = true;
                lo = mid + 1;
              } else {
                hi = mid - 1;
              }
            }
            runs.push({ from: from, to: from + best, tight: !ok });
            from += best;
          }
          return runs;
        }

        // Sentences are the unit, and a screen breaks between them wherever it
        // can. Where it cannot — one sentence longer than the whole box, which a
        // 390x844 phone in landscape 横書き at 40px reaches on sixteen sentences
        // across the six stories — it breaks inside the sentence at a token
        // boundary instead. Laying the sentence down over the box was the
        // alternative: measured there, the worst ran 103px past a two-line box
        // and overflow: clip deleted twenty-one line boxes of 猫を探す探偵 outright, on
        // screens with nothing to say they were incomplete. The tail keeps the
        // sentence's own <span class="s"> and its data-en, so 訳 reaches it from
        // either half.
        //
        // A position is (sentence s, token t). t is 0 except directly after such
        // a break, so a corpus with no oversized sentence paginates exactly as it
        // did when sentences were the only unit.
        function splitText(i, count) {
          const sents = DATA.pages[i];
          const runs = [];
          let s = 0, t = 0;
          while (s < count) {
            if (fitsText(i, s, count, t, -1)) {
              runs.push({ from: s, to: count, head: t, tail: -1, tight: false });
              break;
            }
            let lo = s + 1, hi = count - 1, end = 0;
            while (lo <= hi) {
              const mid = (lo + hi) >> 1;
              if (fitsText(i, s, mid, t, -1)) { end = mid; lo = mid + 1; }
              else hi = mid - 1;
            }
            if (end) {
              runs.push({ from: s, to: end, head: t, tail: -1, tight: false });
              s = end;
              t = 0;
              continue;
            }
            // Not even this one sentence fits from here. Longest run of its
            // tokens that does; one token is always placed, so t or s advances.
            const n = sents[s].toks.length;
            let a = t + 1, b = n - 1, cut = t + 1, ok = false;
            while (a <= b) {
              const mid = (a + b) >> 1;
              if (fitsText(i, s, s + 1, t, mid)) { cut = mid; ok = true; a = mid + 1; }
              else b = mid - 1;
            }
            runs.push({ from: s, to: s + 1, head: t, tail: cut, tight: !ok });
            if (cut >= n) { s++; t = 0; } else t = cut;
          }
          return runs;
        }

        function splitAfter() {
          if (afterRuns) return afterRuns;
          const n = atoms().length;
          afterRuns = n ? split(fitsAfter, n) : [];
          return afterRuns;
        }

        function computePage(i) {
          const n = DATA.pages[i].length;
          const runs = n
            ? splitText(i, n)
            : [{ from: 0, to: 0, head: 0, tail: -1, tight: false }];
          const out = runs.map((r, sub) => ({
            page: i, sub: sub, kind: "text", flowing: flowing,
            from: r.from, to: r.to, head: r.head, tail: r.tail,
            tight: r.tight, afterSub: -1,
          }));
          // An empty afterword appends zero screens. Every docs/versions build
          // ships one, and a blank trailing screen there would put the screen
          // count out of step with the page count.
          if (i === total - 1 && DATA.afterword) {
            const after = splitAfter();
            for (let k = 0; k < after.length; k++) {
              out.push({
                page: i, sub: out.length, kind: "after", flowing: flowing,
                from: after[k].from, to: after[k].to, tight: after[k].tight, afterSub: k,
              });
            }
          }
          mpage.textContent = "";
          mpage.className = "page";
          return out;
        }

        function screensOf(i) {
          if (i < 0 || i >= total) return [];
          ensure();
          let s = cache.get(i);
          if (!s) {
            s = computePage(i);
            cache.set(i, s);
          }
          return s;
        }

        function screenAt(addr) {
          if (!addr) return null;
          return screensOf(addr.page)[addr.sub] || null;
        }

        const screenCount = (i) => screensOf(i).length;

        function textCount(i) {
          const s = screensOf(i);
          let n = 0;
          for (let k = 0; k < s.length; k++) if (s[k].kind === "text") n++;
          return n;
        }

        // ------------------------------------------------------- address math

        const whole = (v) => (isFinite(v) ? Math.floor(v) : 0);

        // The only range guard in the file, and the restore path goes through it:
        // a stored position against a story whose page count has changed would
        // otherwise index past DATA.pages and throw before anything paints.
        function clamp(addr) {
          const page = Math.min(
            Math.max(whole(addr ? Number(addr.page) : 0), 0),
            total - 1
          );
          const n = Math.max(screenCount(page), 1);
          const sub = Math.min(Math.max(whole(addr ? Number(addr.sub) : 0), 0), n - 1);
          return { page: page, sub: sub };
        }

        function next(addr) {
          if (!addr) return null;
          if (addr.sub + 1 < screenCount(addr.page)) {
            return { page: addr.page, sub: addr.sub + 1 };
          }
          if (addr.page + 1 < total) return { page: addr.page + 1, sub: 0 };
          return null;
        }

        function prev(addr) {
          if (!addr) return null;
          if (addr.sub > 0) return { page: addr.page, sub: addr.sub - 1 };
          if (addr.page > 0) {
            const p = addr.page - 1;
            return { page: p, sub: Math.max(screenCount(p) - 1, 0) };
          }
          return null;
        }

        const first = () => ({ page: 0, sub: 0 });

        // End belongs to the story, not to the spoilers: the あとがき is only
        // reachable by turning past the last page.
        const last = () => ({
          page: total - 1,
          sub: Math.max(textCount(total - 1) - 1, 0),
        });

        const final = () => ({
          page: total - 1,
          sub: Math.max(screenCount(total - 1) - 1, 0),
        });

        const sameAddress = (a, b) => !!a && !!b && a.page === b.page && a.sub === b.sub;
        const isFirst = (addr) => prev(addr) === null;
        const isLast = (addr) => next(addr) === null;
        const isAfter = (addr) => {
          const s = screenAt(addr);
          return !!s && s.kind !== "text";
        };

        // A split page's first screen keeps the bare number; only the second and
        // later carry the dot, so a page that did not split reads exactly as it
        // did before.
        function screenLabel(addr) {
          const s = screenAt(addr);
          if (!s) return "";
          if (s.kind === "text") {
            return String(s.page + 1) + (s.sub ? SEP + (s.sub + 1) : "");
          }
          return AFTER_MARK + (s.afterSub ? SEP + (s.afterSub + 1) : "");
        }

        // The denominator stays the authored page count — the number cited in the
        // afterwords and stored as progress. It is meaningless on an あとがき
        // screen, so it is not shown there.
        function countLabel(addr) {
          const s = screenAt(addr);
          if (!s) return "";
          const left = screenLabel(addr);
          return s.kind === "text" ? left + " / " + total : left;
        }

        // ------------------------------------------------------------- render

        function renderScreen(pageEl, addr) {
          const s = screenAt(addr);
          pageEl.textContent = "";
          pageEl.className = "page";
          if (!s) return;
          if (s.kind === "text") {
            if (s.tight) pageEl.classList.add("tight");
            pageEl.append(buildText(s.page, s.from, s.to, s.flowing, s.head, s.tail));
            return;
          }
          // A sibling class, not a modifier: body.flowing .page p (0,2,2) would
          // otherwise beat .page.after p (0,2,1) and put a 全角 indent into
