<html lang="ja">
  <head>
    <meta charset="utf-8" />

    <title>終電</title>
    <style>
      :root {
        --paper: #faf7f0;
        --ink: #22201c;
        --muted: #8a8377;
        --rule: #e2dcd0;
        --accent: #7a5c2e;
        --weak: #b4562a;
        --new: #2f7d6a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #16151a;
          --ink: #e8e4dc;
          --muted: #8b8578;
          --rule: #2c2a31;
          --accent: #d3b075;
          --weak: #e0895e;
          --new: #6cc5ab;
        }
      }
      * { box-sizing: border-box; }
      /* The page itself never scrolls. Header, progress bar and footer are
         fixed height, and only <main> scrolls, so the controls and the page
         counter stay put however long a page runs. dvh rather than vh because
         iOS counts the collapsing toolbar into vh and cuts the footer off. */
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      header, footer {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 1.5rem;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 0.85rem;
        color: var(--muted);
        flex-shrink: 0;
      }
      header { border-bottom: 1px solid var(--rule); }
      footer { border-top: 1px solid var(--rule); }
      h1 { font-size: 1rem; margin: 0; color: var(--ink); font-weight: 600; }
      .spacer { flex: 1; }
      button {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0.35rem 0.8rem;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.35; cursor: default; }
      button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      /* Styled as a button but an anchor, so it works with no JS and offers a
         real target for open-in-new-tab. */
      a.btn {
        font: inherit;
        color: var(--muted);
        text-decoration: none;
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0.35rem 0.8rem;
      }
      a.btn:hover { border-color: var(--accent); color: var(--accent); }

      /* min-height:0 lets a flex child actually scroll instead of growing, and
         `safe center` keeps a page taller than the viewport from having its top
         clipped, which plain centring does to an overflowing flex container. */
      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: safe center;
        padding: 3rem 1.5rem;
      }
      #page {
        width: 100%;
        max-width: 34rem;
        margin-inline: auto;
        font-size: clamp(1.55rem, 1.15rem + 1.5vw, 2.15rem);
        /* Ruby is always laid out, only its opacity changes — hovering a word
           must not reflow the paragraph under the cursor. */
        line-height: 2.6;
      }
      #page p { margin: 0 0 1.1rem; }
      /* A sentence with a translation available gets no permanent marking —
         the affordance is the 訳 button; a marker on every line would compete
         with the leech and new-word underlines that carry real information. */
      #page p.has-en { cursor: pointer; }
      .en {
        display: none;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 0.52em;
        line-height: 1.5;
        color: var(--muted);
        margin-top: -0.6em;
        padding-left: 0.9em;
        border-left: 2px solid var(--rule);
      }
      p.show-en .en, body.all-en .en { display: block; }
      ruby { ruby-position: over; }
      rt {
        font-size: 0.44em;
        color: var(--accent);
        opacity: 0;
        transition: opacity 0.12s ease;
        user-select: none;
      }
      .w { cursor: help; border-radius: 3px; }
      .w:hover rt, .w.pin rt, body.all rt { opacity: 1; }
      .w:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
      .w.pin { background: color-mix(in srgb, var(--accent) 16%, transparent); }
      .w.weak { text-decoration: underline dotted var(--weak) 1.5px; text-underline-offset: 0.28em; }
      /* Approved stretch vocabulary: not yet learned, so the reading
         is shown unconditionally rather than waiting for a hover. */
      .w.new { text-decoration: underline solid var(--new) 1.5px; text-underline-offset: 0.28em; }
      .w.new rt { opacity: 1; color: var(--new); }
      #gloss {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 4.2rem;
        max-width: 30rem;
        padding: 0.5rem 0.85rem;
        background: var(--ink);
        color: var(--paper);
        border-radius: 7px;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 0.82rem;
        line-height: 1.45;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease;
      }
      #gloss.on { opacity: 0.96; }
      #count { font-variant-numeric: tabular-nums; }
      #bar { height: 2px; background: var(--rule); flex-shrink: 0; }
      /* Full-spoiler note, last page only, collapsed until asked for. The
         stories state nothing thematic themselves, so this is the handhold. */
      #after {
        margin: 2.5rem auto 0;
        width: 100%;
        max-width: 34rem;
        flex-shrink: 0;
        border-top: 1px solid var(--rule);
        padding-top: 1rem;
        font-size: 0.94rem;
        line-height: 1.75;
      }
      #after summary {
        cursor: pointer;
        color: var(--accent);
        font-size: 0.85rem;
        letter-spacing: 0.04em;
      }
      #after p { margin: 0.9rem 0 0; }
      #after ruby rt { font-size: 0.5em; opacity: 0.75; }
      #bar div { height: 100%; background: var(--accent); transition: width 0.2s ease; }
    </style>

"聞いた","r":[["聞","き"],["いた",null]],"k":"きいた","g":"to hear; to listen (e.g. to music); to ask; to enquire; to query; to hear about; to hear of; to learn of; to follow (adv"},{"t":"人","r":[["人","ひと"]],"k":"ひと","g":"person; someone; somebody; human beings; mankind; man; people; humans; human (Homo sapiens); (other) people; others; cha"},{"t":"の"},{"t":"物になる","r":[["物","もの"],["になる",null]],"k":"ものになる","g":"to prove successful; to take hold; to amount to something"},{"t":"。"}],"en":"But words become the property of the one who hears them."},{"toks":[{"t":"私","r":[["私","わたし"]],"k":"わたし","g":"I; me"},{"t":"は"},{"t":"やっと"},{"t":"、"},{"t":"照明","r":[["照明","しょうめい"]],"k":"しょうめい","g":"illumination; lighting"},{"t":"を"},{"t":"つけた"},{"t":"。"}],"en":"At last I turned on the light."},{"toks":[{"t":"机","r":[["机","つくえ"]],"k":"つくえ","g":"desk"},{"t":"の"},{"t":"上","r":[["上","うえ"]],"k":"うえ","g":"above; up; over; elder (e.g. daughter); top; summit; head (e.g. of a staircase); surface; before; previous; superiority;"},{"t":"の"},{"t":"書類","r":[["書類","しょるい"]],"k":"しょるい","g":"document; official papers","w":"書類"},{"t":"が"},{"t":"、"},{"t":"白く","r":[["白","しろ"],["く",null]],"k":"しろく","g":"white"},{"t":"光った","r":[["光","ひか"],["った",null]],"k":"ひかった","g":"to shine; to glitter; to be bright"},{"t":"。"}],"en":"The company's papers on the desk shone white."}]],"stats":{"words":286,"translated":74,"sentences":74,"weak":["去年","後悔","書類","正確","渡る","過ぎる"],"approved":["明かり"],"unknown":[],"knownVocab":6502}};
      const $ = (id) => document.getElementById(id);
      let page = 0;
      let showMeaning = false;

      $("title").textContent = DATA.title;
      const approved = DATA.stats.approved || [];
      $("note").textContent =
        `${DATA.stats.words} 漢字語 · 既知語彙 ${DATA.stats.knownVocab}` +
        (DATA.stats.weak.length ? ` · 苦手 ${DATA.stats.weak.length}` : "") +
        (approved.length ? ` · 新出 ${approved.join("、")}` : "") +
        (DATA.stats.translated ? ` · 訳 ${DATA.stats.translated}/${DATA.stats.sentences}` : "");

      function render() {
        const el = $("page");
        el.textContent = "";
        for (const sentence of DATA.pages[page]) {
          const p = document.createElement("p");
          if (sentence.en) p.className = "has-en";
          for (const tok of sentence.toks) {
            if (!tok.r) {
              p.append(document.createTextNode(tok.t));
              continue;
            }
            const span = document.createElement("span");
            span.className =
              "w" + (tok.w ? " weak" : "") + (tok.n ? " new" : "");
            span.dataset.kana = tok.k || "";
            span.dataset.gloss = tok.g || "";
            for (const [text, ruby] of tok.r) {
              if (ruby) {
                const r = document.createElement("ruby");
                r.append(document.createTextNode(text));
                const rt = document.createElement("rt");
                rt.textContent = ruby;
                r.append(rt);
                span.append(r);
              } else {
                span.append(document.createTextNode(text));
              }
            }
            p.append(span);
          }
          if (sentence.en) {
            const en = document.createElement("span");
            en.className = "en";
            en.textContent = sentence.en;
            p.append(en);
          }
          el.append(p);
        }
        const last = page === DATA.pages.length - 1;
        const after = $("after");
        after.hidden = !(last && DATA.afterword);
        if (!after.hidden && !after.dataset.filled) {
          after.dataset.filled = "1";
          const sum = document.createElement("summary");
          sum.textContent = "あとがき — what this was doing (spoilers)";
          const body = document.createElement("p");
          body.innerHTML = DATA.afterword;
          after.append(sum, body);
        }
        $("count").textContent = `${page + 1} / ${DATA.pages.length}`;
        $("prev").disabled = page === 0;
        $("next").disabled = page === DATA.pages.length - 1;
        $("bar").firstElementChild.style.width =
          `${((page + 1) / DATA.pages.length) * 100}%`;
        hideGloss();
      }

      function go(n) {
        const next = Math.min(Math.max(n, 0), DATA.pages.length - 1);
        if (next === page) return;
        page = next;
        render();
        // <main> is the scroll container now, not the window.
        document.querySelector("main").scrollTop = 0;
      }

      function hideGloss() { $("gloss").classList.remove("on"); }

      $("prev").onclick = () => go(page - 1);
      $("next").onclick = () => go(page + 1);
      $("trans").onclick = (e) => {
        const on = document.body.classList.toggle("all-en");
        e.currentTarget.setAttribute("aria-pressed", String(on));
      };
      $("furi").onclick = (e) => {
        const on = document.body.classList.toggle("all");
        e.currentTarget.setAttribute("aria-pressed", String(on));
      };
      $("mean").onclick = (e) => {
        showMeaning = !showMeaning;
        e.currentTarget.setAttribute("aria-pressed", String(showMeaning));
        if (!showMeaning) hideGloss();
      };

      // Every navigation key here is also a native scroll key, and <main> is a
      // scroll container, so each one has to preventDefault or it both flips the
      // page and scrolls. Space and PageDown read to the bottom of a long page
      // before advancing; on a page that fits, which is most of them, there is
      // nothing to scroll and they flip immediately.
      document.addEventListener("keydown", (e) => {
        const m = document.querySelector("main");
        const room = m.scrollHeight - m.clientHeight - m.scrollTop;
        const nav = (fn) => { e.preventDefault(); fn(); };

        if (e.key === "ArrowLeft") nav(() => go(page - 1));
        else if (e.key === "ArrowRight") nav(() => go(page + 1));
        else if (e.key === " " || e.key === "PageDown") {
          nav(() => (room > 4 ? (m.scrollTop += m.clientHeight * 0.85) : go(page + 1)));
        } else if (e.key === "PageUp") {
          nav(() => (m.scrollTop > 4 ? (m.scrollTop -= m.clientHeight * 0.85) : go(page - 1)));
        } else if (e.key === "Home") nav(() => go(0));
        else if (e.key === "End") nav(() => go(DATA.pages.length - 1));
        else if (e.key === "f") $("furi").click();
        else if (e.key === "t") $("trans").click();
      });

      // Clicking a kanji word pins its reading; clicking the rest of the line
      // reveals that one sentence's translation.
      $("page").addEventListener("click", (e) => {
        const w = e.target.closest(".w");
        if (w) {
          w.classList.toggle("pin");
          return;
        }
        const p = e.target.closest("p.has-en");
        if (p) p.classList.toggle("show-en");
      });

      $("page").addEventListener("mouseover", (e) => {
        const w = e.target.closest(".w");
        if (!w || !showMeaning) return;
        const g = $("gloss");
        g.textContent = `${w.textContent}【${w.dataset.kana}】${
          w.dataset.gloss ? " — " + w.dataset.gloss : ""
        }`;
        g.classList.add("on");
      });
      $("page").addEventListener("mouseout", (e) => {
        if (e.target.closest(".w")) hideGloss();
      });

      render();
    </script>
